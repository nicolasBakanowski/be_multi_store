name: multistore-backend-integration

services:
  db:
    image: mysql:8.0
    container_name: multistore_mysql_integration
    command: --default-authentication-plugin=mysql_native_password --bind-address=0.0.0.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-testroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-multistore_test}
      MYSQL_USER: ${MYSQL_USER:-multistore}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-multistore}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -uroot -p$$MYSQL_ROOT_PASSWORD -e \"SELECT 1\" >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mysql_integration_data:/var/lib/mysql

volumes:
  mysql_integration_data:

